<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown until the app renders: see styles.css. Boxed as the root's <main>. Its words: @braivo/i18n/boot. -->
    <div id="boot" role="status" aria-atomic="false" class="mx-auto max-w-3xl p-6">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        class="mx-auto my-12 block size-6 animate-spin motion-reduce:animate-pulse text-muted-foreground"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      <span class="sr-only" data-boot="loading">Loading</span>
      <p class="text-center text-sm text-muted-foreground" data-boot="help">
        Still loading? Check your connection, then <a href="" class="underline">reload</a>.
      </p>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
