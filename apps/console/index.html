<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Braivo's icons, except on a learn domain's sign-in (a non-empty
         `?handoff=`, as the route reads it), which wears no Braivo branding
         (ADR 0018). That page is marked instead, so its loading screen keeps
         the neutral theme (styles.css); the root route keeps the mark after. -->
    <script>
      if (new URLSearchParams(location.search).get("handoff")) {
        document.documentElement.dataset.learnDomain = "";
      } else {
        for (const [rel, href] of [
          ["icon", "/favicon.svg"],
          ["apple-touch-icon", "/apple-touch-icon.png"],
        ]) {
          const link = document.createElement("link");
          link.rel = rel;
          link.href = href;
          document.head.append(link);
        }
      }
    </script>
    <!-- The theme before the first paint, so a dark page never flashes light:
         `ThemeProvider`'s rule and storage key (`braivo-theme`), restated as
         no module has loaded yet. -->
    <script>
      {
        // Unreadable storage (blocked by policy, say) is no choice: the system's.
        let theme = null;
        try {
          theme = localStorage.getItem("braivo-theme");
        } catch {}
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (theme !== "light" && dark)) {
          document.documentElement.classList.add("dark");
        }
      }
    </script>
    <!-- A link, not an import in main.tsx: the dev server then serves it before
         the first paint too, as the build does, so the boot screen below is
         styled, not bare, while the modules load. -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown until the app renders: see styles.css. Boxed as the root's <main>. Its words: @braivo/i18n/boot. -->
    <div id="boot" role="status" aria-atomic="false" class="mx-auto max-w-3xl p-6">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        class="mx-auto my-12 block size-6 animate-spin motion-reduce:animate-pulse text-muted-foreground"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      <span class="sr-only" data-boot="loading">Loading</span>
      <p class="text-center text-sm text-muted-foreground" data-boot="help">
        Still loading? Check your connection, then <a href="" class="underline">reload</a>.
      </p>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
