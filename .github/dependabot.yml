# Keeps the workflows' actions current, which nothing else does: checkout fell
# two majors behind unnoticed. Monthly, grouped into one pull request, which
# Check gates like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
