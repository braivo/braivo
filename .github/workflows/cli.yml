# The standalone `braivo` for each platform a content owner's machine runs,
# attached to the release a version tag makes, so signing in, adding material,
# and `braivo mcp` need no clone and no Bun (docs/adr/0027-standalone-cli.md).
name: CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Cross-compiled from one runner: Bun embeds its runtime for each target.
      - run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            bun build --compile --target="bun-$target" apps/server/cli/index.ts \
              --outfile "dist/braivo-$target"
          done

      # The one this runner can run: a build that crashes on start never ships.
      - run: dist/braivo-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: dist/braivo-*
          if-no-files-found: error

  # Its own job so the token that can write releases never meets the build's
  # dependencies.
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/braivo-* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
