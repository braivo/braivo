# Licensing for files that do not carry it themselves. Braivo's source files
# (.ts, .tsx, .css, scripts) carry a two-line SPDX header instead, and are not
# listed here, so `bun run license:check` fails for one that lacks it.
# See docs/adr/0002-agpl-only.md.
version = 1

# Braivo's files that cannot, or should not, carry a header: docs, JSON,
# markup, the lockfile, generated code a tool overwrites, and database migrations.
[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "**/*.html",
  ".gitignore",
  ".worktreeinclude",
  "bun.lock",
  "apps/*/routeTree.gen.ts",
  "packages/db/schema/auth.ts",
  "packages/db/migrations/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Konstantin Tarkus"
SPDX-License-Identifier = "AGPL-3.0-only"

# shadcn/ui components, generated by the shadcn CLI (docs/adr/0012-shadcn-preset.md).
# MIT, as shadcn publishes them. Braivo's few marked edits to these files are
# MIT too, so each file keeps the one license its upstream has.
[[annotations]]
path = [
  "packages/ui/components/**",
  "packages/ui/hooks/**",
  "packages/ui/lib/**",
  "packages/ui/styles/**",
  "packages/ui/components.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2023 shadcn"
SPDX-License-Identifier = "MIT"

# Braivo's stories, beside the shadcn components they show, are excluded from
# the MIT entry above. This entry, the last to match, supplies no licensing, so
# a story's own SPDX header must, and one without it fails the check.
[[annotations]]
path = "packages/ui/components/**/*.stories.tsx"
precedence = "closest"
